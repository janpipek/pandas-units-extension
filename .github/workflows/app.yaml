name: pandas-units-extension

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        environment: [py311, py312, py313, py314, py315, minimum-versions, astropy-nightly, pandas-nightly]
        include:
          - os: windows-latest
            environment: py315
          - os: macos-latest
            environment: py315            
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Create virtual environment with Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          environments: ${{ matrix.environment }}

      - name: Run pytest
        run: pixi run -e ${{ matrix.environment }} test


  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
          python-version: "3.15"
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build
        run: uv build
